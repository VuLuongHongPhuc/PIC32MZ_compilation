<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>

<button onclick="sendCmd()">Envoyer</button>

<div id="log"></div>

<script>

const ws = new WebSocket("ws://127.0.0.1:8080");

ws.onopen = () => {
    console.log("Connecté");
};

ws.onmessage = (event) => {
    document.getElementById("log").innerHTML +=
        event.data + "<br>";
};

function sendCmd()
{
    ws.send("LED_ON\r\n");
}

</script>

</body>
</html>
